# ============================================================================
# XBRL concept -> standardized statement line mapping, VERSION 2.
#
# = every v1 line, unchanged, plus cost_of_revenue, gross_profit,
# operating_income, long_term_debt and short_term_debt (margins and leverage).
# v1 stays loadable unchanged (mappings are immutable per version). Concepts
# are tried IN ORDER; the first one with data for a period wins.
#
# Totals vs components (a line takes ONE concept per period and never sums, so
# a fallback to a component would silently understate a total):
#   cost_of_revenue: TOTAL concepts only (CostOfRevenue,
#     CostOfGoodsAndServicesSold). CostOfGoodsSold and CostOfServices are
#     components, exposed as the separate lines cost_of_goods_sold and
#     cost_of_services; an issuer that reports only the two components has an
#     empty cost_of_revenue, and the caller adds the two lines.
#   short_term_debt: TOTAL current debt only (DebtCurrent). Components are
#     separate lines: current_portion_long_term_debt (LongTermDebtCurrent,
#     LongTermDebtAndCapitalLeaseObligationsCurrent), commercial_paper
#     (CommercialPaper) and short_term_borrowings (ShortTermBorrowings,
#     OtherShortTermBorrowings, LoansAndNotesPayable). KO reports no
#     DebtCurrent (checked in the FY2025 facts): its short_term_debt is empty
#     and the caller sums the component lines, checking each `concept`:
#     leave commercial_paper out when short_term_borrowings resolved to
#     ShortTermBorrowings, a total that can already include commercial paper.
#   long_term_debt: LongTermDebtNoncurrent, then
#     LongTermDebtAndCapitalLeaseObligations (the NON-current amount per
#     us-gaap; KO uses it), then LongTermDebt last. LongTermDebt can include
#     the current portion, so when its `concept` appears, long_term_debt plus
#     short_term_debt may double count the current portion.
#
# `liabilities` keeps the v1 concept only: the pipeline has no derived
# (computed) lines, so no fallback such as Assets - Equity. Issuers that omit
# the plain Liabilities concept (e.g. KO) have an empty line; compute the
# difference downstream from `assets` and `equity` if needed.
# ============================================================================
version: 2
taxonomy: us-gaap
statement_lines:
  revenue:
    statement: income
    concepts:
      - RevenueFromContractWithCustomerExcludingAssessedTax
      - Revenues
      - SalesRevenueNet
  net_income:
    statement: income
    concepts:
      - NetIncomeLoss
  assets:
    statement: balance
    concepts:
      - Assets
  liabilities:
    statement: balance
    concepts:
      - Liabilities
  equity:
    statement: balance
    concepts:
      - StockholdersEquity
      - StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
  operating_cash_flow:
    statement: cash_flow
    concepts:
      - NetCashProvidedByUsedInOperatingActivities
      - NetCashProvidedByUsedInOperatingActivitiesContinuingOperations
  cost_of_revenue:
    statement: income
    concepts:
      - CostOfRevenue
      - CostOfGoodsAndServicesSold
  cost_of_goods_sold:
    statement: income
    concepts:
      - CostOfGoodsSold
  cost_of_services:
    statement: income
    concepts:
      - CostOfServices
  gross_profit:
    statement: income
    concepts:
      - GrossProfit
  operating_income:
    statement: income
    concepts:
      - OperatingIncomeLoss
  long_term_debt:
    statement: balance
    concepts:
      - LongTermDebtNoncurrent
      - LongTermDebtAndCapitalLeaseObligations
      - LongTermDebt
  short_term_debt:
    statement: balance
    concepts:
      - DebtCurrent
  current_portion_long_term_debt:
    statement: balance
    concepts:
      - LongTermDebtCurrent
      - LongTermDebtAndCapitalLeaseObligationsCurrent
  commercial_paper:
    statement: balance
    concepts:
      - CommercialPaper
  short_term_borrowings:
    statement: balance
    concepts:
      - ShortTermBorrowings
      - OtherShortTermBorrowings
      - LoansAndNotesPayable
