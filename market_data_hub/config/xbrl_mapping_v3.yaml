# ============================================================================
# XBRL concept -> standardized statement line mapping, VERSION 3.
#
# v2 = every v1 line, unchanged, plus cost_of_revenue, gross_profit,
# operating_income, long_term_debt and short_term_debt (margins and leverage).
# v1 stays loadable unchanged (mappings are immutable per version). Concepts
# are tried IN ORDER; the first one with data for a period wins.
#
# Totals vs components (a line takes ONE concept per period and never sums, so
# a fallback to a component would silently understate a total):
#   cost_of_revenue: TOTAL concepts only (CostOfRevenue,
#     CostOfGoodsAndServicesSold). CostOfGoodsSold and CostOfServices are
#     components, exposed as the separate lines cost_of_goods_sold and
#     cost_of_services; an issuer that reports only the two components has an
#     empty cost_of_revenue, and the caller adds the two lines.
#   short_term_debt: TOTAL current debt only (DebtCurrent). Components are
#     separate lines: current_portion_long_term_debt (LongTermDebtCurrent,
#     LongTermDebtAndCapitalLeaseObligationsCurrent), commercial_paper
#     (CommercialPaper) and short_term_borrowings (ShortTermBorrowings,
#     OtherShortTermBorrowings, LoansAndNotesPayable). KO reports no
#     DebtCurrent (checked in the FY2025 facts): its short_term_debt is empty
#     and its components stay separate. Components can overlap by issuer
#     (ShortTermBorrowings or LongTermDebtCurrent may include commercial
#     paper), so the hub never sums them; check each `concept` against the
#     filing before adding components.
#   long_term_debt: LongTermDebtNoncurrent, then
#     LongTermDebtAndCapitalLeaseObligations (the NON-current amount per
#     us-gaap; KO uses it), then LongTermDebt last. LongTermDebt can include
#     the current portion, so when its `concept` appears, long_term_debt plus
#     short_term_debt may double count the current portion.
#
# `liabilities` keeps the v1 concept only and is NEVER filled by a computation.
#
# v3 = every v2 line, unchanged, plus the `derived_lines` section below.
# Many issuers (AMZN, LLY, ABBV, MRK, TMO, ABT, ORCL, INTC, AMD, DIS, CMCSA,
# VZ, WMT, TGT, MCD, NKE) never file the plain Liabilities concept. For them
# v3 adds `liabilities_derived` = LiabilitiesAndStockholdersEquity minus
# equity (preferred: equity including the noncontrolling interest, so the
# result is total liabilities; fallback: StockholdersEquity, which then also
# leaves any noncontrolling/redeemable interest inside the result and is
# recorded in the `subtrahend` provenance). Rules: computed per period, only
# for periods where the filed `liabilities` line has no value; a separate
# key, so a filed value is never overwritten; every value carries
# derived: true, the formula and the concept/accession/filed date of each
# input (inputs share the same period end; accessions may differ).
# ============================================================================
version: 3
taxonomy: us-gaap
statement_lines:
  revenue:
    statement: income
    concepts:
      - RevenueFromContractWithCustomerExcludingAssessedTax
      - Revenues
      - SalesRevenueNet
  net_income:
    statement: income
    concepts:
      - NetIncomeLoss
  assets:
    statement: balance
    concepts:
      - Assets
  liabilities:
    statement: balance
    concepts:
      - Liabilities
  equity:
    statement: balance
    concepts:
      - StockholdersEquity
      - StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
  operating_cash_flow:
    statement: cash_flow
    concepts:
      - NetCashProvidedByUsedInOperatingActivities
      - NetCashProvidedByUsedInOperatingActivitiesContinuingOperations
  cost_of_revenue:
    statement: income
    concepts:
      - CostOfRevenue
      - CostOfGoodsAndServicesSold
  cost_of_goods_sold:
    statement: income
    concepts:
      - CostOfGoodsSold
  cost_of_services:
    statement: income
    concepts:
      - CostOfServices
  gross_profit:
    statement: income
    concepts:
      - GrossProfit
  operating_income:
    statement: income
    concepts:
      - OperatingIncomeLoss
  long_term_debt:
    statement: balance
    concepts:
      - LongTermDebtNoncurrent
      - LongTermDebtAndCapitalLeaseObligations
      - LongTermDebt
  short_term_debt:
    statement: balance
    concepts:
      - DebtCurrent
  current_portion_long_term_debt:
    statement: balance
    concepts:
      - LongTermDebtCurrent
      - LongTermDebtAndCapitalLeaseObligationsCurrent
  commercial_paper:
    statement: balance
    concepts:
      - CommercialPaper
  short_term_borrowings:
    statement: balance
    concepts:
      - ShortTermBorrowings
      - OtherShortTermBorrowings
      - LoansAndNotesPayable
derived_lines:
  liabilities_derived:
    statement: balance
    only_if_absent: liabilities
    formula: "LiabilitiesAndStockholdersEquity - equity"
    minuend:
      - LiabilitiesAndStockholdersEquity
    subtrahends:
      - StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
      - StockholdersEquity
