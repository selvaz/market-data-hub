rejections:
- source: nasdaq
  country_iso3: USA
  name: Housing Starts
  reason: A level in millions of units (1.177M) where the indicator is declared m/m and every
    other source publishes the change (-15.4%). Same release, not the same number.
- source: nasdaq
  country_iso3: AUS
  name: Building Approvals
  reason: Year-on-year (10.20%, 5.30%, 8.90% -- all positive across months when Tradays' m/m
    alternates sign) under an indicator declared m/m.
- source: nasdaq
  country_iso3: USA
  name: Core PCE Prices
  reason: The annual rate (4.40%, 3.40%) under an indicator declared m/m, where Tradays and
    MyFXBook publish the monthly (0.1-0.3%). The name carries no frequency, so only the values
    give it away.
- source: nasdaq
  country_iso3: USA
  name: Core PCE Price Index
  reason: Nasdaq uses two names for the same annual rate -- this one and 'Core PCE Prices'
    -- and rejecting only the first left the second arriving at 3.4% against the monthly 0.3%.
    A source is not one name.
- source: yahoo
  country_iso3: USA
  name: Core PCE Prices Advance
  reason: The advance annual estimate (3.4) from the GDP report, not the monthly deflator
    from the personal income report.
- source: yahoo
  country_iso3: EMU
  name: GDP Revised QQ *
  reason: The revised estimate (-0.2) alongside the first estimate (0%) of the same quarter.
    Both are real; mixing vintages inside one indicator makes the series contradict itself.
    Revisions belong in calendar_observations, which already keeps them by vintage_date.
- source: tradays
  country_iso3: CAN
  name: Retail Sales m/m
  reason: The outlier in two months of three (0.9 against 0.6 and 0.6; 1.0 against 0.4 and
    0.4), most likely the ex-autos series under a name that declares plain m/m. Rejected on
    the balance of the evidence, not on certainty -- and Nasdaq is the outlier in the third
    month (1.0 against 0.5 and 0.5), so this indicator is not settled, it is only mostly settled.
    Left visible in the disagreement report rather than silenced by rejecting whichever source
    disagrees until the count reaches zero.
- source: nasdaq
  country_iso3: USA
  name: Capacity Utilization Rate
  decided_by: reconciled-2026-08-14
  reason: Proposed for us_fomc by name reconciliation. Capacity utilisation has nothing to
    do with the FOMC decision; it paired on value alone.
- source: myfxbook
  country_iso3: USA
  name: Capacity Utilization
  decided_by: reconciled-2026-08-14
  reason: Proposed for us_fomc by name reconciliation. Same coincidence from the other source.
- source: nasdaq
  country_iso3: USA
  name: Philly Fed Employment
  decided_by: reconciled-2026-08-14
  reason: Proposed for us_housing by name reconciliation. The Philadelphia Fed employment
    sub-index is not housing starts.
- source: tradays
  country_iso3: USA
  name: Philadelphia Fed Employment
  decided_by: reconciled-2026-08-14
  reason: Proposed for us_housing by name reconciliation. Same coincidence from the other
    source.
- source: nasdaq
  country_iso3: USA
  name: U6 Unemployment Rate
  decided_by: reconciled-2026-08-14
  reason: Proposed for us_unemp by name reconciliation. U6 counts discouraged and part-time-for-economic-reasons
    workers; it runs roughly double the headline U3 and is a different measure, not a variant.
- source: tradays
  country_iso3: USA
  name: U6 Unemployment Rate
  decided_by: reconciled-2026-08-14
  reason: Proposed for us_unemp by name reconciliation. Same measure, other source.
- source: nasdaq
  country_iso3: CHN
  name: Outstanding Loan Growth
  decided_by: reconciled-2026-08-14
  reason: Proposed for cn_indprod by name reconciliation. Credit growth, not industrial output.
- source: nasdaq
  country_iso3: JPN
  name: CPI Tokyo Ex Food & Energy
  decided_by: reconciled-2026-08-14
  reason: Proposed for jp_indprod by name reconciliation. Tokyo core-core inflation, filed
    against industrial production purely on a shared value.
- source: nasdaq
  country_iso3: DEU
  name: Bavaria CPI
  decided_by: reconciled-2026-08-14
  reason: Proposed for de_cpi_yy by name reconciliation. A Land index, like the Saxony and
    Hesse ones already kept out of the euro-area HICP.
- source: myfxbook
  country_iso3: AUS
  name: Building Permits YoY
  decided_by: reconciled-2026-08-14
  reason: Proposed for au_building by name reconciliation. The annual rate under an indicator
    declared m/m.
- source: nasdaq
  country_iso3: JPN
  name: Tankan All Small Industry CAPEX
  decided_by: reconciled-2026-08-14
  reason: Proposed for jp_tankan by name reconciliation. The small-firm capex sub-index, not
    the headline Tankan diffusion index.
- source: tradays
  country_iso3: JPN
  name: BoJ Tankan Small All Industry Capex
  decided_by: reconciled-2026-08-14
  reason: Proposed for jp_tankan by name reconciliation. Same sub-index, other source.
- source: nasdaq
  country_iso3: GBR
  name: Core Retail Sales
  decided_by: reconciled-2026-08-14
  reason: Proposed for uk_retail by name reconciliation. Core is a different series from the
    headline.
- source: myfxbook
  country_iso3: CHN
  name: Balance of Trade Yuan
  decided_by: reconciled-2026-08-14
  reason: 'Proposed for cn_trade by name reconciliation. The same balance quoted in yuan:
    roughly seven times the USD figure the indicator carries.'
- source: nasdaq
  country_iso3: CAN
  name: Core CPI
  decided_by: verified-2026-08-14
  reason: The m/m (0.1) against a y/y indicator (2.1).
- source: nasdaq
  country_iso3: DEU
  name: German CPI
  decided_by: verified-2026-08-14
  reason: Nasdaq's bare 'German CPI' is the m/m (0.6, -0.2, -0.2) where the indicator is y/y
    (2.9, 2.6). Bound in error by reconciliation and caught by the disagreement report the
    same run.
- source: nasdaq
  country_iso3: USA
  name: PPI
  decided_by: verified-2026-08-14
  reason: The m/m (1.1, 1.4) against a y/y indicator (6.0, 6.5).
- source: nasdaq
  country_iso3: USA
  name: Retail Sales
  decided_by: verified-2026-08-14
  reason: The y/y (6.72) against an indicator declared m/m (0.2).
