# Catalogo del calendario economico.
#
# criticality: T1 critico (muove i mercati o determina le attese di politica
# monetaria), T2 rilevante (qualifica il quadro), T3 contesto.
# La classificazione e' redazionale: il livello di impatto pubblicato dagli
# aggregatori non e' utilizzabile (Tradays da' 'low' al FOMC).
#
# match_rules: gruppi separati da ';', alternative da '|'. Servono perche'
# ogni fonte chiama lo stesso indicatore in modo diverso.
#
# freq: M mensile, Q trimestrale, A annuale, W settimanale, E a calendario
# (riunioni di banca centrale).

archetypes:
- key: cpi_yy
  value_type: Variazione % a/a
  description: 'Headline consumer inflation: the change in the price of a basket of goods and services against the same month a year earlier.'
  methodology: 'A fixed-weight basket, reweighted periodically from a household expenditure survey. The y/y absorbs seasonality but carries base effects: a weak month a year ago mechanically inflates the current reading.'
- key: cpi_mm
  value_type: Variazione % m/m
  description: 'Consumer inflation against the previous month: it measures the current momentum of prices.'
  methodology: 'Normally seasonally adjusted. More responsive but noisier than the y/y; practitioners annualise the rolling quarter to read the trend.'
- key: cpi_qq
  value_type: Variazione % t/t
  description: 'Australian quarterly consumer inflation, the country''s primary format.'
  methodology: 'Australia published only a quarterly CPI for decades; the monthly series is recent and thinner in coverage. The RBA watches the trimmed mean above all, which excludes the tails of the distribution rather than fixed categories.'
- key: core_cpi
  value_type: Variazione % a/a
  description: 'Underlying inflation: CPI excluding food and energy, the two most volatile components.'
  methodology: 'The exclusion is for volatility, not irrelevance. It is the central banks'' reference because it approximates the persistent component. In the US owners'' equivalent rent carries a large weight and responds to the housing market with a 9-12 month lag.'
- key: core_cpi_jp
  value_type: Variazione % a/a
  description: 'Japanese core inflation, which by national convention excludes only fresh food, not energy.'
  methodology: 'Mind the definition: the Japanese ''core'' is not comparable with the American or European one because it includes energy. The measure equivalent to the Western core is called ''core-core'' in Japan (excluding fresh food and energy).'
- key: tokyo_cpi
  value_type: Variazione % a/a
  description: 'Consumer price index for the Tokyo area.'
  methodology: 'It comes out about three weeks before the national figure and is the best available predictor of it, with a very high correlation. It is the real market mover on Japanese inflation.'
- key: hicp
  value_type: Variazione % a/a
  description: 'Harmonised index of consumer prices for the euro area: the measure the ECB sets its 2% objective against.'
  methodology: 'Harmonised across countries by Eurostat to make them comparable; it differs from national indices mainly in the treatment of owner-occupied housing, which the HICP substantially excludes. The flash estimate comes out at month end and is finalised in the middle of the following month.'
- key: ppi_yy
  value_type: Variazione % a/a
  description: 'Producer prices: what producers receive, upstream of the consumer price.'
  methodology: 'An imperfect leading indicator of the CPI: pass-through downstream depends on margins and final demand. In China the PPI is followed as a thermometer of the global industrial cycle and of commodity prices.'
- key: pce
  value_type: Variazione % a/a
  description: 'Core personal consumption expenditures deflator: the Federal Reserve''s preferred inflation measure.'
  methodology: 'Against the CPI it uses variable weights that track substitution between goods, it also covers healthcare paid by third parties, and it runs structurally 20-40 basis points below the CPI.'
- key: ipca
  value_type: Variazione %
  description: 'Brazil''s official consumer price index: the central bank''s formal target.'
  methodology: 'Computed by IBGE over households earning 1 to 40 minimum wages across 13 metropolitan areas. There is also the IPCA-15, an early version collected in the middle of the month.'
- key: wpi
  value_type: Variazione % a/a
  description: 'Indian wholesale prices: inflation upstream in the supply chain.'
  methodology: 'It contains no services, so it often diverges widely from the Indian CPI. Since 2016 the RBI targets the CPI, not the WPI, but the WPI remains relevant to industrial margins.'
- key: igpm
  value_type: Variazione % a/a
  description: 'Brazil''s general price index, computed by the Getulio Vargas Foundation and used to index rents and contracts.'
  methodology: 'A weighted average of wholesale (60%), consumer (30%) and construction (10%) prices. The heavy wholesale component makes it far more volatile than the IPCA and sensitive to the exchange rate.'
- key: payrolls
  value_type: Migliaia di posti
  description: 'Change in US non-farm employment: the most watched macro figure in the world alongside the CPI.'
  methodology: 'An establishment survey, distinct from the household survey the unemployment rate comes from: the two can diverge. Subject to material revisions over the following two months and to an annual benchmark adjustment.'
- key: unemployment_rate
  value_type: '%'
  description: 'The share of the labour force without work and actively seeking it.'
  methodology: 'A household survey. The level is not comparable across countries because definitions differ. A lagging indicator of the cycle: it turns after the recession has already begun.'
- key: employment_change
  value_type: Migliaia di posti
  description: 'Net change in the number of employed people in the month.'
  methodology: 'From a household sample survey, so with a wide standard error: in Australia and Canada a single month says little, and the full-time/part-time split is what counts.'
- key: claims
  value_type: Migliaia di domande
  description: 'New weekly claims for unemployment benefit in the US.'
  methodology: 'An administrative figure, not a sample, so it is immediate and barely revised. Weekly and noisy: read it on the 4-week moving average. One of the few genuinely leading labour indicators.'
- key: jolts
  value_type: Milioni di posizioni
  description: 'US job openings at month end.'
  methodology: 'It comes out about a month later than payrolls. The ratio of openings to unemployed is the labour market tightness measure the Fed cites explicitly.'
- key: earnings
  value_type: Variazione %
  description: 'Average hourly earnings: the channel through which the labour market feeds inflation.'
  methodology: 'Distorted by composition effects: if the jobs lost are mostly low-paid ones, the average rises without anyone getting a raise.'
- key: claimant
  value_type: Migliaia di persone
  description: 'Change in the number of benefit claimants in the United Kingdom.'
  methodology: 'A monthly administrative figure, more timely than ILO unemployment but sensitive to changes in benefit eligibility rules, which break its historical comparability.'
- key: wages
  value_type: Variazione % t/t
  description: 'Australia''s wage price index: wage growth at constant composition.'
  methodology: 'Built by following the same jobs over time, so it is immune to the composition effects that distort average earnings. Quarterly and closely watched by the RBA.'
- key: gdp_qq
  value_type: Variazione % t/t
  description: 'Gross domestic product against the previous quarter.'
  methodology: 'In the US it is published annualised (multiplied by roughly 4), elsewhere it is not: comparing the raw numbers across countries is a common mistake. Three successive estimates, with revisions that can be wide.'
- key: gdp_yy
  value_type: Variazione % a/a
  description: 'Gross domestic product against the same quarter a year earlier.'
  methodology: 'The standard format in China, India and Taiwan. More stable than the q/q but much slower to signal the turns of the cycle.'
- key: gdp_mm
  value_type: Variazione % m/m
  description: 'Monthly GDP estimate, published only by the United Kingdom and Canada.'
  methodology: 'Reconstructed from the output side by summing sectoral production indices. Very volatile and sensitive to strikes and public holidays.'
- key: retail
  value_type: Variazione %
  description: 'Retail sales: the most direct read on household demand.'
  methodology: 'Expressed in value, not volume, so when inflation is high the nominal figure overstates real demand. In the US the market watches the ''control group'', which excludes autos, petrol, building materials and food services because that is what enters GDP.'
- key: indprod
  value_type: Variazione %
  description: 'Industrial production: the physical output of manufacturing, mining and utilities.'
  methodology: 'It covers only 15-20% of GDP in advanced economies but generates much of their cyclical volatility. Very sensitive to temperature (the utility component) and to car-plant shutdowns.'
- key: fai
  value_type: Variazione % a/a cumulata
  description: 'Chinese fixed asset investment: infrastructure, property and manufacturing.'
  methodology: 'Published cumulatively from the start of the year, not monthly: obtaining the single month requires differencing. The split between property and infrastructure is more informative than the total.'
- key: durable
  value_type: Variazione % m/m
  description: 'US durable goods orders: spending commitments for goods with a useful life beyond three years.'
  methodology: 'Dominated by aircraft orders, which can move the headline by ten points. The subset actually read is ''core capital goods'', a proxy for private investment.'
- key: factory_orders
  value_type: Variazione % m/m
  description: 'German factory orders: commitments received by manufacturing firms.'
  methodology: 'They lead industrial production by 2-3 months. Very volatile because of the weight of single bulk orders, which the statistical office flags separately; the figure excluding bulk orders is the one to read.'
- key: housing
  value_type: Migliaia annualizzate
  description: 'New residential construction started.'
  methodology: 'A small sector in GDP terms but strongly leading, because it is the first to react to rates. A very volatile series, sensitive to weather; building permits lead starts.'
- key: machinery
  value_type: Variazione %
  description: 'Core machinery orders in Japan, excluding ships and electric power.'
  methodology: 'The exclusions remove single orders of enormous size. It is the best leading indicator of Japanese private investment, with about six months of lead.'
- key: building
  value_type: Variazione % m/m
  description: 'Australian building approvals.'
  methodology: 'Very volatile because of the weight of multi-family apartments; the detached-house segment is more stable and more informative about the cycle.'
- key: mfg_sales
  value_type: Variazione % m/m
  description: 'Sales of the Canadian manufacturing sector.'
  methodology: 'At current values; the heavy weight of autos and energy makes it dependent on commodity prices and on the American industrial cycle.'
- key: pmi_mfg
  value_type: Indice diffusione 0-100
  description: 'Manufacturing purchasing managers'' index: 50 separates expansion from contraction.'
  methodology: 'A qualitative survey (better/same/worse), so it measures direction, not intensity. Coming out on the first working day of the month, it is one of the earliest signals available. Flash versions come out mid-month on a partial sample.'
- key: pmi_svc
  value_type: Indice diffusione 0-100
  description: 'Services purchasing managers'' index.'
  methodology: 'More relevant than manufacturing to GDP in advanced economies, but historically less correlated with the turning points of the cycle and with markets.'
- key: ism_mfg
  value_type: Indice diffusione 0-100
  description: 'US ISM manufacturing index: the longest and most followed industrial sentiment series.'
  methodology: 'Distinct from the S&P Global PMI, which covers the same sector with a different sample and method. Below 42-43 it has historically signalled recession for the whole economy, not just industry. The new orders and inventories sub-components lead the headline index.'
- key: ism_svc
  value_type: Indice diffusione 0-100
  description: 'US ISM services index.'
  methodology: 'A shorter series (from 1997) with less recessionary history, so its thresholds are less reliable. The employment component is followed as a leading indicator of payrolls.'
- key: ivey
  value_type: Indice diffusione 0-100
  description: 'Canadian purchasing managers'' index published by the Ivey Business School.'
  methodology: 'It covers both the private and the public sector, unlike the standard PMIs, and has a small sample: very noisy.'
- key: tankan
  value_type: Saldo % (diffusion index)
  description: 'The Bank of Japan''s quarterly survey of business conditions.'
  methodology: 'The balance between firms judging conditions favourable and unfavourable, so it can be negative. A very large sample (about 10,000 firms) and a high response rate: the most reliable business survey in Japan.'
- key: zew
  value_type: Saldo %
  description: 'Six-month expectations of German analysts and institutional investors.'
  methodology: 'It measures the expectations of financial operators, not of firms: more a thermometer of market sentiment than of the real economy, and indeed very volatile.'
- key: ifo
  value_type: Indice (base 2015=100)
  description: 'German business confidence over about 9,000 firms.'
  methodology: 'It combines a judgement on current conditions with six-month expectations. The expectations component is the one with leading content; the gap between the two is read as a signal that the cycle is turning.'
- key: sentix
  value_type: Saldo %
  description: 'Euro-area investor confidence, surveyed at the start of the month.'
  methodology: 'The first figure of the month on the euro area, hence closely watched despite its limited sample of private and institutional investors.'
- key: umich
  value_type: Indice (base 1966=100)
  description: 'US consumer sentiment surveyed by the University of Michigan.'
  methodology: 'Published twice: preliminary mid-month and final at month end. The 1-year and 5-10 year inflation expectations contained in the survey are cited explicitly by the Fed and often move markets more than the headline index.'
- key: nbs_pmi
  value_type: Indice diffusione 0-100
  description: 'China''s official PMI from the National Bureau of Statistics.'
  methodology: 'The sample is skewed towards large state-owned firms, while Caixin covers small, private, export-oriented ones: the two series diverge systematically and should be read together.'
- key: caixin
  value_type: Indice diffusione 0-100
  description: 'Chinese PMI from Caixin/S&P Global.'
  methodology: 'A sample of smaller, private, export-exposed firms relative to the official PMI. More sensitive to the global trade cycle.'
- key: trade_balance
  value_type: Valuta locale o USD
  description: 'The balance between exports and imports of goods.'
  methodology: 'A nominal figure, so it mixes volumes and prices: a rise in oil worsens importers'' balances without any change in volumes. Highly seasonal (Chinese New Year, the European August).'
- key: exports
  value_type: Variazione % a/a
  description: 'Goods exports.'
  methodology: 'For China and Korea they are the most timely thermometer of global demand. In China the January and February figures are published together to neutralise the drift of the lunar new year.'
- key: imports
  value_type: Variazione % a/a
  description: 'Goods imports.'
  methodology: 'Read as a measure of domestic demand and, for China, of the commodity cycle. Sensitive to prices as well as volumes.'
- key: export_orders
  value_type: Variazione % a/a
  description: 'Taiwanese export orders: commitments received by the island''s firms.'
  methodology: 'They lead actual exports by 2-3 months and, given Taiwan''s position in the semiconductor supply chain, are among the best leading indicators of the global tech cycle.'
- key: exports20
  value_type: Variazione % a/a
  description: 'Korean exports over the first 20 days of the month.'
  methodology: 'The most timely macro figure in the world on global trade: out around the 21st of the same month. It has to be corrected for the number of working days, which the raw figure does not normalise.'
- key: remittances
  value_type: Milioni di USD
  description: 'Remittances from Mexican emigrants.'
  methodology: 'A balance-of-payments item comparable to oil receipts and decisive for low-income household consumption and for the exchange rate.'
- key: policy_rate
  value_type: '%'
  description: 'The central bank''s decision on the policy rate.'
  methodology: 'What moves markets is almost never the decision itself, which is anticipated, but the statement, the projections and the press conference. The calendar is fixed and known a year in advance.'
- key: lpr
  value_type: '%'
  description: 'China''s 1-year Loan Prime Rate: the reference rate for bank lending.'
  methodology: 'Set monthly as the average of quotes from a panel of banks, but in practice guided by the PBoC through the medium-term lending facility rate.'
- key: loans
  value_type: Miliardi di valuta locale
  description: 'New yuan loans extended during the month.'
  methodology: 'A central instrument of Chinese economic policy, more so than the rate lever. Extremely seasonal: January is systematically the highest month of the year.'
- key: m2
  value_type: Variazione % a/a
  description: 'The broad monetary aggregate.'
  methodology: 'In China it is read as a measure of the credit impulse; the related ''total social financing'' series is more complete because it includes non-bank credit.'
- key: psnb
  value_type: Miliardi di sterline
  description: 'UK public sector net borrowing.'
  methodology: 'Highly seasonal: January and July are months of heavy tax receipts and the balance can turn positive. Relevant to expectations for gilt issuance.'
