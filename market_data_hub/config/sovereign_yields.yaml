# Original official daily observations only. See docs/f08-sovereign-yields.md.
# Unavailable countries remain visible; never silently use monthly/auction data.
defaults: &daily
  enabled: true
  role: current
  unit: "%"
  frequency: D
  asset_class: MACRO
  priority: 1
  expected_lag_days: 3  # declared availability estimate, not live-measured
  max_lag_days: 3
  lag_calendar: business
  # Optional explicit national market closures: holidays: [YYYY-MM-DD, ...]

series:
  - <<: *daily
    symbol: ITA_BTP10_MOT
    country: ITA
    source: Borsa Italiana
    provider: mot
    name: Nearest 10y nominal fixed-rate BTP, MOT published gross yield
    provider_code: nearest_10y_nominal_btp
    endpoint: https://www.borsaitaliana.it/borsa/obbligazioni/mot/btp/lista.html
    selection_rule: nearest_10y_residual_then_earlier_maturity_then_isin
    history_mode: current_only_daily_accumulation
  - <<: *daily
    symbol: DEU_BUND10_FA
    country: DEU
    source: Bundesrepublik Deutschland Finanzagentur
    provider: finanzagentur
    name: Nearest 10y conventional nominal Bund, issuer published reference yield
    provider_code: nearest_10y_nominal_bund
    endpoint: https://www.deutsche-finanzagentur.de/fileadmin/user_upload/Institutionelle-investoren/bundesbank/Rendite_engl.pdf
    selection_rule: nearest_10y_residual_then_earlier_maturity_then_isin
    history_mode: current_only_daily_accumulation
  # EMU is an aggregate region marker, not a national ISO3 code. ECB AAA is
  # the explicit Bund stand-in; never relabel these curves as German yields.
  - <<: *daily
    symbol: CB_EA_AAA_10Y
    country: EMU
    source: ECB
    provider: ecb
    name: Euro-area AAA government 10y spot rate, continuous compounding (Bund stand-in)
    provider_code: B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y
    endpoint: https://data-api.ecb.europa.eu/service/data/YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y
  - <<: *daily
    symbol: CB_EA_AAA_2Y
    country: EMU
    source: ECB
