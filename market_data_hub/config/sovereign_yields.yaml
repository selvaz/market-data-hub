    provider_code: B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y
    endpoint: https://data-api.ecb.europa.eu/service/data/YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y
