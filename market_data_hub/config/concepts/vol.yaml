concepts:
- concept: VIX
  family: vol
  label: VIX close
  unit: index
  frequency: D
  calendar: nyse
  sources:
  - kind: price
    id: ^VIX
    role: primary
    max_age_business_days: 2
    convention: unadjusted close
    field: close
    live: post_close
  - kind: macro
    id: VIXCLS
    role: secondary
    max_age_business_days: 3
    convention: CBOE VIX close
  history:
    mode: single
    id: VIXCLS
  check:
    ids:
    - ^VIX
    - VIXCLS
    tolerance: 0.1
    unit: absolute
    note: CBOE VIX closing index through Yahoo and FRED.
