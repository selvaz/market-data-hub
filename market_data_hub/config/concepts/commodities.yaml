concepts:
- concept: BRENT
  family: commodities
  label: Brent crude
  unit: USD/barrel
  frequency: D
  calendar: ice_brent
  sources:
  - kind: price
    id: BZ=F
    role: primary
    max_age_business_days: 2
    convention: unadjusted close
    field: close
    live: post_close
  - kind: macro
    id: DCOILBRENTEU
    role: secondary
    max_age_business_days: 7
    convention: spot
    comparability_note: EIA spot versus front-month futures; delivery and fixing time
      differ.
  - kind: price
    id: BNO
    role: proxy
    max_age_business_days: 2
    convention: adjusted close
    field: adj_close
    live: post_close
    unit: USD/share
    comparability_note: Futures ETF price; not a spot or futures level.
  history:
    mode: single
    id: DCOILBRENTEU
  check:
    ids:
    - BZ=F
    - DCOILBRENTEU
    tolerance: 3.0
    unit: pct
    note: Front-month future versus EIA spot.
