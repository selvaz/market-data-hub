# US macro release concepts (H2). The concept id is the macro_releases
# catalogue indicator_id. Chain: primary = issuer release (macro_releases), then
# an optional FRED secondary from the indicator card's ms: ids, transformed into
# the release unit. history = that single FRED series (never spliced).
#
# max_age_business_days rule (same for every source of a concept):
#   ceil((period_days + issuer_lag_days + 7) * 5 / 7)
# period_days: M 31, W 7, Q 92, E 49 (longest gap between FOMC meetings);
# issuer_lag_days: macro_releases.catalogue.EXPECTED_LAG_DAYS of the family;
# 7 days of grace. Age is counted from the reference period end in Mon-Fri
# business days (no holiday calendar yet).
concepts:
- concept: us_cpi_headline_yy
  family: releases
  label: US CPI-U all items, y/y (NSA)
  unit: '%'
  frequency: M
  calendar: us_govt
  # max age: M period + 14d issuer lag + 7d grace
  # FRED CPIAUCSL is seasonally adjusted; BLS publishes the headline 12-month change from the NSA index (CUUR0000SA0), which is not in macro_series. No FRED secondary.
  sources:
  - kind: release
    id: us_cpi_headline_yy
    role: primary
    max_age_business_days: 38
    convention: issuer published value (BLS, yy, NSA)
- concept: us_cpi_headline_mm
  family: releases
  label: US CPI-U all items, m/m (SA)
  unit: '%'
  frequency: M
  calendar: us_govt
  # max age: M period + 14d issuer lag + 7d grace
  sources:
  - kind: release
    id: us_cpi_headline_mm
    role: primary
    max_age_business_days: 38
    convention: issuer published value (BLS, mm, SA)
  - kind: macro
    id: CPIAUCSL
    role: secondary
    max_age_business_days: 38
    convention: FRED pct_change_mm of CPIAUCSL
    transform: pct_change_mm
    scale: 1
    comparability_note: "Computed from the unrounded SA index; BLS rounds the published change to one decimal."
  history:
    mode: single
    id: CPIAUCSL
- concept: us_cpi_core_yy
