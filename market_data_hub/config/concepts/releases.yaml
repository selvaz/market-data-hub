  # FRED CPILFESL is seasonally adjusted; BLS publishes the 12-month change from the NSA index (CUUR0000SA0L1E), not in macro_series. No FRED secondary.
  sources:
  - kind: release
    id: us_cpi_core_yy
    role: primary
    max_age_business_days: 38
    convention: issuer published value (BLS, yy, NSA)
- concept: us_cpi_core_mm
