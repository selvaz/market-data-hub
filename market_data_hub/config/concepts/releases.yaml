  label: US CPI ex food and energy, m/m (SA)
  unit: '%'
  frequency: M
  calendar: us_govt
  # max age: M period + 14d issuer lag + 7d grace
  sources:
  - kind: release
    id: us_cpi_core_mm
    role: primary
    max_age_business_days: 38
