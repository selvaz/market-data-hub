- concept: DXY
  family: fx
  label: US Dollar Index
  unit: index
  frequency: D
  calendar: ice_us
  sources:
  - kind: price
    id: DX-Y.NYB
    role: primary
    max_age_business_days: 2
    convention: unadjusted close
    field: close
    live: post_close
  - kind: price
    id: UUP
    role: proxy
    max_age_business_days: 2
    convention: adjusted close
    field: adj_close
    live: post_close
    unit: USD/share
    comparability_note: ETF tracks dollar futures; not the index level.
- concept: DTWEXBGS
  family: fx
  label: Broad trade-weighted US dollar
  unit: index
  frequency: D
  calendar: us_govt
  sources:
  - kind: macro
    id: DTWEXBGS
    role: primary
    max_age_business_days: 10
    convention: Federal Reserve broad trade-weighted dollar index
  - kind: price
    id: DX-Y.NYB
    role: proxy
    max_age_business_days: 2
    convention: unadjusted close
    field: close
    live: post_close
    unit: index (DXY basket)
    comparability_note: DXY uses a different basket from the broad trade-weighted
      index.
