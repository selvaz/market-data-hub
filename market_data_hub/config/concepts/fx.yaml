concepts:
- concept: EURUSD
  family: fx
  label: EURUSD exchange rate
  unit: USD/EUR
  frequency: D
  calendar: fx
  sources:
  - kind: price
    id: EURUSD=X
    role: primary
    max_age_business_days: 2
    convention: unadjusted close
    field: close
    live: post_close
  - kind: macro
    id: DEXUSEU
    role: fallback
    max_age_business_days: 10
    convention: Federal Reserve H.10 fixing
    comparability_note: H.10 fixing time differs from Yahoo close; daily observations
      are published weekly. Same quote direction.
